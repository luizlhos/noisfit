<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NoisFit">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<title>NoisFit</title>
<style>
:root{
  --bg:#F3F4EF;--card:#FFFFFF;--ink:#101418;--ink2:#2D3338;--mu:#5A6168;--mu2:#B9C0C6;--line:#E3E5DF;--soft:#EEF0EA;
  --lime:#C6F135;--lime-ink:#3F6212;--lime-soft:#EEF8CF;--blue:#1F5BFF;--blue-soft:#E6EDFF;--orange:#C2410C;--orange-soft:#FDEBDD;
  --red:#B42318;--red-soft:#FDE4E1;--r:18px;
  --f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fd:"Space Grotesk",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(84px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
main{max-width:520px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px}
a{color:inherit;text-decoration:none}
h1{font:700 28px/1.1 var(--fd);margin:0;letter-spacing:-.01em}
h2{font-size:16px;font-weight:700;margin:0}
h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:8px 0 -4px}
p{margin:0}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}.b{font-weight:700}.num{font-family:var(--fd);font-weight:700}
.row{display:flex;gap:10px;align-items:center}.sp{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.card{background:var(--card);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.dark{background:var(--ink);color:#fff}.dark .mu{color:var(--mu2)}
.hd{display:flex;align-items:center;gap:10px}
.hd .sub{font-size:12px;color:var(--mu)}
.back{width:44px;height:44px;border-radius:22px;background:var(--card);border:0;display:grid;place-items:center;flex:none;color:var(--ink);cursor:pointer}
.back svg,.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-weight:700;flex:none;border:0;font-size:16px;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill.lime{background:var(--lime);color:var(--ink)}.pill.ok{background:var(--lime-soft);color:var(--lime-ink)}
.pill.warn{background:var(--orange-soft);color:var(--orange)}.pill.bad{background:var(--red-soft);color:var(--red)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--lime)}
.dark .bar{background:#2D3338}
.btn{border:0;border-radius:14px;padding:13px 16px;font:600 15px var(--f);background:var(--soft);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.pri{background:var(--ink);color:#fff}.btn.lime{background:var(--lime);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}.btn.ghost{background:transparent;color:var(--lime-ink);padding:6px 4px}
.btn.block{width:100%}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
.link{color:var(--lime-ink);font-weight:600;font-size:13px;background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font:16px var(--f);color:var(--ink)}
.card input,.card select,.card textarea{background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);border-color:transparent}
textarea{resize:vertical;min-height:80px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);padding:4px;border-radius:14px}
.card .seg{background:var(--bg)}
.seg button{height:40px;border:0;border-radius:10px;font:600 13px var(--f);background:transparent;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;font-weight:700}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--soft)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}.li .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.li .t span{display:block;font-size:12px;color:var(--mu)}
.ib{width:36px;height:36px;border-radius:10px;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;flex:none;cursor:pointer}
.tile{width:44px;height:44px;border-radius:14px;background:var(--lime);display:grid;place-items:center;flex:none}
.tile svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{font:700 44px/1 var(--fd)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;border-radius:999px;padding:10px 14px;background:var(--card);font:600 14px var(--f);color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
.notice{background:var(--lime-soft);color:var(--lime-ink);border-radius:14px;padding:12px 14px;font-size:14px}
.notice.warn{background:var(--orange-soft);color:var(--orange)}
.notice.bad{background:var(--red-soft);color:var(--red)}
.photo{position:relative;border:1.5px dashed var(--mu2);border-radius:14px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--mu);text-align:center;padding:8px;overflow:hidden;cursor:pointer;background:var(--bg)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.photo.has{border-style:solid;border-color:var(--lime)}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 4px;text-align:left;border-bottom:1px solid var(--soft)}
th{font-size:11px;color:var(--mu);font-weight:600}
td.r,th.r{text-align:right}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end}
.podium>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.podium .av{width:52px;height:52px;border-radius:26px;background:#DDE3EA;display:grid;place-items:center;font-weight:700}
.podium .p1 .av{width:60px;height:60px;border-radius:30px;background:var(--lime);font-size:20px}
.podium .base{width:100%;background:var(--card);border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.podium .p1 .base{background:var(--ink);color:#fff}
.podium .nm{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font:700 30px/1 var(--fd);letter-spacing:.18em}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav#tabs a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mu)}
nav#tabs a span{padding:4px 16px;border-radius:999px;display:flex}
nav#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav#tabs a.on{color:var(--ink);font-weight:700}nav#tabs a.on span{background:var(--lime)}
body.nologin nav#tabs{display:none}body.nologin{padding-bottom:20px}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(16,20,24,.25);transition:opacity .3s}
#toast[hidden]{display:block;opacity:0;pointer-events:none}
#modal{position:fixed;inset:0;background:rgba(16,20,24,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.mbox{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mbox input,.mbox select,.mbox textarea{background:var(--bg)}
.login{max-width:400px;margin:6vh auto 0;width:100%}
.logo{width:72px;height:72px;border-radius:22px;background:var(--ink);display:grid;place-items:center;margin:0 auto}
.logo svg{width:40px;height:40px;fill:none;stroke:var(--lime);stroke-width:2.4;stroke-linecap:round}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sw input[type=checkbox]{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:999px;background:var(--line);position:relative;border:0;padding:0;flex:none;cursor:pointer}
.sw input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input[type=checkbox]:checked{background:var(--lime-ink)}.sw input[type=checkbox]:checked::after{left:23px}
details.card summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.card summary::after{content:"+";color:var(--mu)}details.card[open] summary::after{content:"−"}
.foot{font-size:11px;color:var(--mu);text-align:center}
</style>
</head>
<body class="nologin">
<main id="app"><div class="spin"></div></main>
<nav id="tabs" aria-label="Navegação principal">
  <a href="#hoje" data-tab="hoje"><span><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Hoje</a>
  <a href="#treino" data-tab="treino"><span><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg></span>Treino</a>
  <a href="#dieta" data-tab="dieta"><span><svg viewBox="0 0 24 24"><path d="M8 3v18M5 3v5a3 3 0 0 0 6 0V3M17 21V3c-2 1-3 4-3 8h3"/></svg></span>Dieta</a>
  <a href="#desafios" data-tab="desafios"><span><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0zM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M10 17h4v4h-4z"/></svg></span>Desafios</a>
  <a href="#avaliacao" data-tab="avaliacao"><span><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></span>Avaliação</a>
</nav>
<div id="modal" hidden></div>
<div id="toast" hidden role="status"></div>
<script src="supabase.min.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
